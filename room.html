},true);
function setItem(v){
  var multi=GRP[v.n]&&GRP[v.n].items.length>1;
  forTargets(function(T){
    var gi=-1;T.items.forEach(function(it,i){if(gi<0&&(multi?it.g===v.n:it.c===v.id))gi=i});
    if(gi<0)T.items.push(mkItem(v));
    else if(T.items[gi].c===v.id)T.items.splice(gi,1);
    else T.items[gi]=mkItem(v);
  });
}

$('ls').onclick=function(e){

  else if(a==='lvd'||a==='lvu'){var it2=T.items[i],g2=lvGroup(it2);if(!g2)return;var ix=g2.items.map(function(v){return v.id}).indexOf(it2.c)+(a==='lvu'?1:-1);if(ix<0||ix>=g2.items.length)return;T.items[i]=mkItem(g2.items[ix],it2.r)}

async function sendDoc(id,k){
  var T=DATA[id][k],r=dayRef(id,k),sn=await getDoc(r),old=sn.exists()?sn.data():{};
  var od=old.done||{},of=old.fin||{},nd={},nf={};
  T.items.forEach(function(it,ni){
    if(it.o>=0){
      if(od[it.o]!=null)nd[ni]=od[it.o];
      if(k==='reg'&&od[it.o+100]!=null)nd[ni+100]=od[it.o+100];
      if(of[it.o]!=null)nf[ni]=of[it.o];
    }
  });
  var out={items:T.items.map(function(it){var x={n:it.n,t:it.t};if(it.u)x.u=it.u;if(it.c)x.c=it.c;if(it.r)x.r=it.r;return x}),done:nd,fin:nf,start:old.start||0,t:Date.now()};
  if(k==='mkp')out.on=T.on;
  for(var q in old){if(!(q in out))out[q]=old[q]}
  await setDoc(r,out);
  T.items.forEach(function(it,ni){it.o=ni;it.f=!!nf[ni]});
  T.exists=true;DATA[id].dirty[k]=false;
}
$('send').onclick=async function(){
  if(BUSY)return;if(!dirtyCount()&&cur()){DATA[cur().id].dirty[TAB]=true}var sent=[];BUSY=true;MSG='보내는 중';drawFoot();
  var fail=0,ok=0;
  for(var id in DATA){
    for(var k in DATA[id].dirty){
      if(!DATA[id].dirty[k])continue;
      try{await sendDoc(id,k);ok++;var sn=ST.filter(function(x){return x.id===id})[0];if(sn&&sent.indexOf(sn.name)<0)sent.push(sn.name)}catch(e){fail++}
    }
  }
  BUSY=false;MSG=fail?('보내지 못한 것 '+fail+'건 · 다시 눌러 주세요'):('전달 완료 · '+sent.join(', ')+' · '+(function(d){return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)})(new Date()));drawAll();
};
