<title>자료실</title>
<style>

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg);text-align:left;display:flex;flex-direction:column;min-width:1100px;overflow:auto}
button{font-family:inherit;cursor:pointer}
.hide{display:none!important}
.in .hd{display:none}
.top{height:56px;flex:none;display:flex;align-items:center;gap:18px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line)}

.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

.ch{flex:none;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.cb{flex:1;min-height:0;overflow:auto;padding:10px 14px}
.cf{flex:none;padding:10px 14px;border-top:1px solid var(--line);background:#FAFBFD}

.clsrow:first-child{margin-top:0}

.cl.on{background:#E8EDF7;color:var(--navy);border-color:var(--navy)}
.tiny{font-size:11px;padding:5px 7px;border:1px solid #BCC7DA;border-radius:6px;background:#fff;color:var(--sub)}

.st input{width:17px;height:17px;flex:none}

.st button:hover{background:#F1F4FA}
.st.cur button{background:var(--navy);color:#fff;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:#e0a100;flex:none}
em.ex{font-style:normal;font-size:11px;font-weight:500;color:var(--ex);background:#FFF1E4;border-radius:6px;padding:1px 6px}

.btn.w{width:100%}
.btn:disabled{opacity:.4}
.note{font-size:12px;color:var(--sub);margin-top:6px}

.ar0 span{display:inline-flex;gap:8px;align-items:baseline;background:var(--ac);color:#fff;border-radius:8px;padding:3px 11px;font-size:13px}
.ar0 i{font-style:normal;font-weight:400;color:rgba(255,255,255,.85)}
.ar0 .tiny{margin-bottom:4px}
.ci{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 2px;border-bottom:1px dashed var(--line);font-size:14px}
.ci b{min-width:26px;color:var(--ac)}
.ci .nm{flex:1;min-width:120px;background:none;border:0;text-align:left;font-size:14px;padding:2px 0}
.ci .nm:hover{text-decoration:underline}
.ci.in .nm{color:#9AA6B8}
.ci .lv{padding:2px 8px;border:1px solid var(--ac);border-radius:999px;background:#fff;color:var(--ac);font-size:12px}
.ci .lv:hover{background:var(--ac);color:#fff}

.refbox .r{display:flex;gap:6px;padding:2px 0}
.refbox .r b{min-width:22px;color:var(--navy)}
.refbox .r.rm span,.refbox .r.rep .old{text-decoration:line-through;color:#9AA6B8}
.refbox .to{color:var(--ex);font-weight:700}
#memo{width:100%;height:100%;border:0;outline:0;resize:none;font:inherit;font-size:16px;line-height:1.9;padding:0;background:transparent;text-align:left;white-space:pre}

.sel{width:100%;height:34px;border:1px solid #BCC7DA;border-radius:8px;font-family:inherit;font-size:13px;padding:0 6px;background:#fff}
.bad{color:#B3261E;font-size:12px;margin:0 0 6px}
.pw{background:#F7F8FC}
.ph-h{display:flex;flex-direction:column;margin:2px 2px 10px}
.ph-h b{font-size:18px}
.ph-h span{font-size:12px;color:var(--sub)}
.sh{font-size:12px;font-weight:700;margin:14px 2px 6px;color:var(--sub)}

.card .t b{font-size:14px;font-weight:500;display:block}

.card .t small.x{color:var(--ex);font-weight:700}
.card .t small.nt{color:#7A8797}

function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function copy(o){var r={};for(var k in o)r[k]=o[k];return r}
function RC(role){return role==='플러스'?'plus':role==='참고'?'ref':role==='페널티'?'pen':''}
function r2role(r){return r==='plus'?'플러스':r==='ref'?'참고':r==='pen'?'페널티':'스텝'}
function dflt(a){return a==='플러스'?'플러스':a==='페널티'?'페널티':'스텝'}
function areaOf(a){return AREAS.filter(function(x){return x[0]===a})[0]}
function rng(a){var m=/(\d+)~(\d+)/.exec(a[1]);return [+m[1],+m[2]]}
function byN(n){return CAT.filter(function(c){return c.n===n})[0]}
function nextN(a){var r=rng(areaOf(a));for(var i=r[0];i<=r[1];i++)if(!byN(i))return i;return ''}
function setMsg(t,keep){var m=$('msg');m.textContent=t||'';clearTimeout(setMsg.t);if(t&&!keep)setMsg.t=setTimeout(function(){m.textContent=''},4000)}
function ck(k){return k.replace(/[^0-9A-Za-z가-힣|_ -]/g,'_')}
function cur(){return ST.filter(function(s){return s.id===SEL})[0]}
function clsOf(sid){var s=ST.filter(function(x){return x.id===sid})[0];return s?s.cls:''}
function members(c){return ST.filter(function(x){return x.cls===c})}

/* ---- catalog ---- */
function regCustom(x){
  var name=x.name||x.g||'',sub=x.sub!=null?x.sub:(x.t||'');
  if(!name||BYID[x.id])return;
  var v={id:x.id,n:name,t:sub,u:x.u||''};BYID[x.id]=v;
  var g=GRP[name];if(!g){g={g:name,items:[]};C.cat.push(g);GRP[name]=g}g.items.push(v);
}
function buildCat(){
  var out=[],used={};
  NB.forEach(function(r){
    var ids=(r[5]==='@rd'?RD.map(function(x){return x.id}):r[5].split(',')).filter(function(i){return BYID[i]});
    if(!ids.length)return;used[r[0]]=1;
    out.push({n:r[0],name:r[1],sub:r[2],area:r[3],role:r[4],ids:ids,b:1});
  });
  CFG.items.forEach(function(x){if(x.no)used[x.no]=1});
  CFG.items.forEach(function(x){
    if(!BYID[x.id])return;
    var a=areaOf(x.a)?x.a:'지정';
    if(!x.no){var r=rng(areaOf(a));for(var i=r[0];i<=r[1];i++)if(!used[i]){x.no=i;used[i]=1;break}if(!x.no)return}
    out.push({n:x.no,name:BYID[x.id].n,sub:BYID[x.id].t,area:a,role:x.role||dflt(a),ids:[x.id],cu:x});
  });
  ID2E={};G2E={};
  out.forEach(function(e){
    e.lv=e.ids.length>1?e.ids.map(function(id){return BYID[id].t}):null;e.rec=e.lv?1:0;
    var o=CFG.ov[e.n];if(o&&e.b){if(o.role)e.role=o.role;if(o.u!=null&&e.ids.length===1)BYID[e.ids[0]].u=o.u}
    e.u=e.ids.length===1?BYID[e.ids[0]].u:'';
    e.ids.forEach(function(id){ID2E[id]=e});
    if(e.ids.length>1)G2E[BYID[e.ids[0]].n]=e;
  });
  out.sort(function(a,b){return a.n-b.n});CAT=out;
}

/* ---- text model ---- */
function kB(c,t){return ck(c+'|'+t)}
function kE(s,t){return ck(s+'|'+t)}
function bT(c,t){return CFG.base[kB(c,t)]||''}
function lineOf(it){
  var role=r2role(it.r),e=it.c&&ID2E[it.c],v=it.c&&BYID[it.c];
  if(!e&&!it.c&&it.g)e=G2E[it.g];
  if(e){
    var li=it.c?e.ids.indexOf(it.c):-1,own='',t0=it.c?(v.t||''):'',t=it.t||'';
    if(t&&t!==t0){if(t0&&t.indexOf(t0+' · ')===0)own=t.slice(t0.length+3);else own=t}
    own=own.replace(/[()]/g,' ').trim();
    var s=(role!==e.role?PF[role]:'')+e.n+(li>=0&&e.ids.length>1?'-'+(li+1):'')+(own?' ('+own+')':'');
    return {s:s,n:e.n,li:li,own:own,role:role,e:e};
  }
  var nm=(it.n||'').replace(/[()]/g,' ').trim(),tt=(it.t||'').replace(/[()]/g,' ').trim();
  return {s:(role!=='스텝'?PF[role]:'')+nm+(tt?' ('+tt+')':''),n:0};
}
function derive(sid,tab){
  var D=DATA[sid];if(!D||!D[tab])return '';
  var cls=clsOf(sid),bm={},lines=[],have={};
  parseBase(bT(cls,tab)).forEach(function(b){if(b.n&&!bm[b.n])bm[b.n]=b});
  D[tab].items.forEach(function(it){
    var l=lineOf(it);
    if(l.n)have[l.n]=1;
    var b=l.n&&bm[l.n];
    if(b&&b.li===l.li&&b.role===l.role&&(b.own||'')===l.own)return;
    lines.push(l.s);
  });
  Object.keys(bm).forEach(function(n){if(!have[n])lines.push('-'+n)});
  return lines.join('\n');
}
function eT(sid,tab){var k=kE(sid,tab);if(CFG.exc[k]!==undefined)return CFG.exc[k];return derive(sid,tab)}
function curTxt(){return MODE==='class'?bT(CLSK,TAB):eT(SEL,TAB)}
function freeze(cls,tab){members(cls).forEach(function(s){var k=kE(s.id,tab);if(CFG.exc[k]===undefined&&DATA[s.id])CFG.exc[k]=derive(s.id,tab)})}
function setTxt(v){
  if(MODE==='class'){freeze(CLSK,TAB);CFG.base[kB(CLSK,TAB)]=v;members(CLSK).forEach(function(x){DIRTY[x.id+'|'+TAB]=1})}
  else{CFG.exc[kE(SEL,TAB)]=v;DIRTY[SEL+'|'+TAB]=1}
  clearTimeout(SAVET);SAVET=setTimeout(saveCfg,1500);
}
function parseItem(s){
  var m=/^([+*!#]?)\s*(\d+)(?:-(\d+))?\s*(?:\(([^)]*)\))?$/.exec(s);
  if(m){
    var c=byN(+m[2]);if(!c)return {bad:m[2]+'번 자료 없음'};
    var li=-1,warn='';
    if(m[3]){var k=+m[3]-1;if(c.ids.length<2||k<0||k>=c.ids.length)warn=c.ids.length>1?m[3]+'단계 없음':'단계 없는 자료';else li=k}
    else if(c.ids.length===1)li=0;
    return {c:c,n:c.n,li:li,pfx:m[1],role:m[1]?RMAP[m[1]]:c.role,own:m[4]||'',warn:warn};
  }
  var m2=/^([+*!#]?)\s*(.*?)\s*\(([^)]*)\)\s*$/.exec(s),pf='',nm=s,ow='';
  if(m2){pf=m2[1];nm=m2[2];ow=m2[3]}else{var m3=/^([+*!#]?)\s*(.*)$/.exec(s);pf=m3[1];nm=m3[2]}
  return {custom:true,name:nm,own:ow,role:pf?RMAP[pf]:'스텝',pfx:pf};
}
function parseBase(t){var o=[];t.split('\n').forEach(function(ln,i){var s=ln.trim();if(!s)return;var it=parseItem(s);it.line=i;o.push(it)});return o}
function parseExc(t){
  var o=[];
  t.split('\n').forEach(function(ln,i){
    var s=ln.trim();if(!s)return;var m;
    if(m=/^-\s*(\d+)$/.exec(s)){o.push({line:i,type:'rm',n:+m[1]});return}
    if(m=/^(\d+)\s*=\s*(.+)$/.exec(s)){o.push({line:i,type:'rep',n:+m[1],item:parseItem(m[2].trim())});return}
    o.push({line:i,type:'item',item:parseItem(s)});
  });
  return o;
}
function build(cls,sid,tab){
  var base=parseBase(bT(cls,tab)),exc=sid?parseExc(eT(sid,tab)):[],warns=[],items=[],ref=[],baseN={};
  base.forEach(function(b){if(b.bad)warns.push((b.line+1)+'줄 '+b.bad);else if(b.n)baseN[b.n]=1});
  var rm={},rep={},ov={},adds=[],hasEx=false;
  exc.forEach(function(e){
    if(e.type==='rm'){if(!baseN[e.n])warns.push('-'+e.n+' 기본에 없음');rm[e.n]=e;hasEx=true}
    else if(e.type==='rep'){if(e.item.bad){warns.push((e.line+1)+'줄 '+e.item.bad);return}if(!baseN[e.n])warns.push(e.n+'= 기본에 없음');rep[e.n]=e;hasEx=true}
    else{var it=e.item;if(it.bad){warns.push((e.line+1)+'줄 '+it.bad);return}if(it.n&&baseN[it.n]){ov[it.n]=e;if(it.pfx)hasEx=true}else{adds.push(e);hasEx=true}}
  });
  base.forEach(function(b){
    if(b.bad)return;
    if(b.n&&rm[b.n]){ref.push({b:b,state:'rm'});return}
    if(b.n&&rep[b.n]){var r=rep[b.n],it=copy(r.item);it.tag='rep';it.from=b.n;it.excLine=r.line;it.etype='rep';ref.push({b:b,state:'rep',to:it});items.push(it);return}
    var it2=copy(b);it2.tag='';
    if(b.n&&ov[b.n]){var o=ov[b.n].item;if(o.li>=0){it2.li=o.li;hasEx=true}if(o.warn)it2.warn=o.warn;if(o.own)it2.own=o.own;if(o.pfx)it2.role=o.role;it2.excLine=ov[b.n].line;it2.etype='ov'}
    ref.push({b:b,state:'ok'});items.push(it2);
  });
  adds.forEach(function(e){var it=copy(e.item);it.tag=base.length?'add':'';it.excLine=e.line;it.etype='item';items.push(it)});
  items.forEach(function(it){if(it.c&&it.li>=0&&it.c.ids.length>1&&false)it.li=it.li});
  return {items:items,ref:ref,warns:warns,hasEx:hasEx};
}
function flat(it){
  var r=RC(it.role);
  if(it.custom)return {n:it.name,t:it.own||'',u:'',c:'',g:'',r:r,o:-1};
  var e=it.c;
  if(e.ids.length>1&&it.li<0){var g=BYID[e.ids[0]].n;return {n:g,t:it.own||'',u:'',c:'',g:g,r:r,o:-1}}
  var v=BYID[e.ids[it.li>=0?it.li:0]];
  return {n:v.n,t:(v.t||'')+(it.own?(v.t?' · ':'')+it.own:''),u:v.u||'',c:v.id,g:GRP[v.n]?v.n:'',r:r,o:-1};
}
function reconcile(nw,old){
  var used={};
  nw.forEach(function(x){
    for(var j=0;j<old.length;j++){
      if(used[j])continue;var y=old[j];
      if((x.c&&x.c===y.c)||(!x.c&&!y.c&&x.n===y.n&&((x.g&&x.g===y.g)||(!x.g&&x.t===y.t)))){x.o=y.o;x.f=y.f;used[j]=1;return}
    }
  });
}

function dayRef(id,k){return doc(db,'vday',id,'days',k)}
function catRef(){return doc(db,'vday','_cat','days','main')}
async function load(id){
  if(DATA[id])return DATA[id];
  var o={dirty:{}};
  for(var i=0;i<TABS.length;i++){
    var k=TABS[i][0],sn=await getDoc(dayRef(id,k)),d=sn.exists()?sn.data():null;
    var its=((d&&d.items)||[]).map(function(it,ix){
      var g=GRP[it.n]?it.n:'',c=it.c||'';
      if(!c&&g){var m=GRP[g].items.filter(function(v){return v.u&&it.u&&v.u===it.u||v.t===it.t})[0];if(m)c=m.id}
      return {n:it.n,t:it.t||'',u:it.u||'',c:c,g:g,r:it.r||'',o:ix,f:!!(d&&d.fin&&d.fin[ix])};
    });
    o[k]={items:its,on:!!(d&&d.on),exists:!!d};
  }
  DATA[id]=o;return o;
}
async function loadCfg(){
  try{
    var sn=await getDoc(catRef()),d=sn.exists()?sn.data():{};
    CFG.items=d.items||[];CFG.ov=d.ov||{};CFG.base=d.base||{};CFG.exc=d.exc||{};CFGOK=true;
  }catch(e){CFGOK=false}
  CFG.items.forEach(regCustom);buildCat();
}
async function saveCfg(){
  if(!CFGOK)return;
  try{await setDoc(catRef(),{items:CFG.items,ov:CFG.ov,base:CFG.base,exc:CFG.exc,t:Date.now()})}catch(e){setMsg('저장하지 못했습니다 · 선생님께 알려 주세요')}
}
async function sendDoc(id,k){
  var T=DATA[id][k],r=dayRef(id,k),sn=await getDoc(r),old=sn.exists()?sn.data():{};
  var od=old.done||{},of=old.fin||{},nd={},nf={};
  T.items.forEach(function(it,ni){
    if(it.o>=0){
      if(od[it.o]!=null)nd[ni]=od[it.o];
      if(k==='reg'&&od[it.o+100]!=null)nd[ni+100]=od[it.o+100];
      if(of[it.o]!=null)nf[ni]=of[it.o];
    }
  });
  var out={items:T.items.map(function(it){var x={n:it.n,t:it.t};if(it.u)x.u=it.u;if(it.c)x.c=it.c;if(it.r)x.r=it.r;return x}),done:nd,fin:nf,start:old.start||0,t:Date.now()};
  if(k==='mkp')out.on=T.on;
  for(var q in old){if(!(q in out))out[q]=old[q]}
  await setDoc(r,out);
  T.items.forEach(function(it,ni){it.o=ni;it.f=!!nf[ni]});
  T.exists=true;
}

function card(it,cls,no,i,cm){
  var parts=[];
  if(it.c&&it.c.lv&&it.li>=0)parts.push(it.c.lv[it.li]);

async function scanAll(){
  for(var i=0;i<ST.length;i+=5){await Promise.all(ST.slice(i,i+5).map(function(s){return load(s.id).catch(function(){})}));drawStudents();try{drawAlerts()}catch(e){}}
}
async function boot(){
  var s=await getDoc(doc(db,'hw_c','master'));
  var d=JSON.parse(s.data().j);
  ST=[{id:'tch1',name:'이성주',cls:'체험 계정'},{id:'tch2',name:'신유정',cls:'체험 계정'}]
    .concat(d.s.filter(function(o){return o.status==='on'&&(o.grade==='초6'||o.grade==='중1'||(o.grade==='초5'&&/초6/.test(o.cls||'')))}).sort(function(a,b){var R=function(c){c=c||'';return /초6/.test(c)?0:/중1/.test(c)?1:/중2/.test(c)?2:/중3/.test(c)?3:9};return R(a.cls)-R(b.cls)||String(a.cls).localeCompare(String(b.cls),'ko')||a.name.localeCompare(b.name,'ko')}).map(function(o){return {id:o.id,name:o.name,cls:o.cls}}));
  await loadCfg();
  $('lg').classList.add('hide');$('app').classList.remove('hide');
  all();scanAll();
}
$('gl').onclick=async function(){
  try{await signInWithPopup(auth,new GoogleAuthProvider())}
  catch(e){if(e.code==='auth/popup-blocked'){await signInWithRedirect(auth,new GoogleAuthProvider())}else{$('le').textContent='로그인하지 못했습니다'}}
};
onAuthStateChanged(auth,function(u){if(u&&!ST.length)boot().catch(function(){$('le').textContent='명단을 불러오지 못했습니다 (선생님 계정인지 확인)'})});
</script>
</body>
