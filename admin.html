<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>관리 - 비타민영어클리닉</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#1a2233;--sub:#6b7480;--line:#e1e5ec;--main:#1e3a6e;--soft:#e6ecf7;--warn:#c2562f;--ok:#2f7d4f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
.hide{display:none!important}
h1{font-size:20px;margin-bottom:4px}.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
button{font:inherit;font-size:14px;font-weight:700;padding:9px 14px;border:0;border-radius:10px;background:var(--main);color:#fff;cursor:pointer}
button.g{background:#fff;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:default}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--sub);font-weight:600}
td.r{font-size:12px;color:var(--sub)}td.r.ok{color:var(--ok)}td.r.ng{color:var(--warn)}
.log{font-size:12px;color:var(--sub);white-space:pre-wrap;margin-top:10px;max-height:160px;overflow:auto}
</style>
</head>
<body>
<div class="wrap">
<h1>학생 계정 관리</h1>
<div class="sub" id="who">선생님 구글 계정으로 로그인하세요</div>
<div class="card" id="lg"><button id="gl">구글 로그인</button><div class="log" id="le"></div></div>

<div class="card hide" id="main">
  <div class="bar">
    <button id="mk">선택한 학생 계정 만들기</button>
    <button id="rs" class="g">선택한 학생 비밀번호 0000</button>
    <button id="sd" class="g">선택한 학생에 샘플 지정 넣기</button>
    <button id="al" class="g">전체 선택</button>
    <button id="no" class="g">선택 해제</button>
  </div>
  <div class="log" id="lo"></div>
  <table style="margin-top:12px"><thead><tr><th></th><th>이름</th><th>반</th><th>학년</th><th>결과</th></tr></thead><tbody id="tb"></tbody></table>
</div>
</div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
var app=initializeApp({apiKey:"AIzaSyC88G-OjMJOqVqnIVqunzh7fvk91wtKKnA",authDomain:"h-roadmap.firebaseapp.com",projectId:"h-roadmap",appId:"1:575520405083:web:b9f40b64cb0ae3d1a9317e"},'vadmin');
var auth=getAuth(app),db=getFirestore(app);
var FN='https://vita-auth-admin-575520405083.asia-northeast3.run.app';
var $=function(i){return document.getElementById(i)};
var ROWS=[],RES={};
var SAMPLE={
  reg:[{n:'비단챌 제출 및 숙제 검사',t:''},{n:'단어 시험',t:''},{n:'비단챌 말하기 시험',t:''},{n:'V시그널',t:''},{n:'개별 독해책',t:''},{n:'클카 독해 TEST',t:''},{n:'지정된 M1 | M2 리딩',t:''},{n:'클카 오늘의 단어 시험 틀린것 문장 오답노트 쓰기',t:''},{n:'대화문 기출',t:'추가'}],
  fri:[{n:'비단챌 및 클카 숙제 검사',t:''},{n:'비단챌 3카드 & 10문제 풀기',t:''},{n:'V 시그널',t:''},{n:'불규칙동사 과거형(1~3)',t:''},{n:'클카 문법 오답노트',t:''},{n:'클카 단어 누적복습',t:''},{n:'클카 독해 TEST',t:''},{n:'개별 독해책',t:''},{n:'클카 단어 재시험',t:''},{n:'저녁 8시 성적표 발송',t:''},{n:'비단챌 문장성분',t:'추가'},{n:'대화문 기출',t:'추가'}],
  mkp:[{n:'밀린 숙제 항목 완료',t:''},{n:'클카 듣기 1세트',t:''},{n:'비단챌 클카 문장 성분 20문장',t:''},{n:'클카 독해 TEST',t:''},{n:'개별 독해책',t:''},{n:'M1/M2 리딩',t:''},{n:'문법 주관식 워크지',t:''}]
};
function lg(t){$('lo').textContent=t+'\n'+$('lo').textContent}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
async function call(b){
  var t=await auth.currentUser.getIdToken();
  var r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+t},body:JSON.stringify(b)});
  return r.json().catch(function(){return {ok:false,e:'응답 오류'}});
}
function draw(){
  $('tb').innerHTML=ROWS.map(function(r,i){
    var s=RES[r.id]||'';var c=s.indexOf('실패')>-1?'ng':(s?'ok':'');
    return '<tr><td><input type="checkbox" data-i="'+i+'"></td><td>'+esc(r.name)+'</td><td>'+esc(r.cls)+'</td><td>'+esc(r.grade)+'</td><td class="r '+c+'">'+esc(s)+'</td></tr>';
  }).join('');
}
function picked(){return [].slice.call(document.querySelectorAll('#tb input:checked')).map(function(x){return ROWS[+x.getAttribute('data-i')]})}
async function boot(){
  var s=await getDoc(doc(db,'hw_c','master'));
  var d=JSON.parse(s.data().j);
  ROWS=[{id:'sample1',name:'샘플1',cls:'선생님 체험(남편)',grade:''},{id:'sample2',name:'샘플2',cls:'선생님 체험(신유정)',grade:''}]
    .concat(d.s.filter(function(o){return o.status==='on'&&(o.grade==='초6'||o.grade==='중1')}).sort(function(a,b){return a.name.localeCompare(b.name,'ko')}).map(function(o){return {id:o.id,name:o.name,cls:o.cls,grade:o.grade}}));
  $('lg').classList.add('hide');$('main').classList.remove('hide');draw();
}
$('gl').onclick=async function(){
  try{await signInWithPopup(auth,new GoogleAuthProvider())}
  catch(e){if(e.code==='auth/popup-blocked'){await signInWithRedirect(auth,new GoogleAuthProvider())}else{$('le').textContent='로그인하지 못했습니다'}}
};
$('al').onclick=function(){document.querySelectorAll('#tb input').forEach(function(x){x.checked=true})};
$('no').onclick=function(){document.querySelectorAll('#tb input').forEach(function(x){x.checked=false})};
$('mk').onclick=async function(){
  var p=picked();if(!p.length)return;$('mk').disabled=true;
  for(var i=0;i<p.length;i++){
    var r=await call({op:'create',id:p[i].id,name:p[i].name});
    RES[p[i].id]=r.ok?'계정 만듦 (첫 비밀번호 1234)':(r.e==='auth/uid-already-exists'||r.e==='auth/email-already-exists'?'이미 있음':'실패: '+r.e);draw();
  }
  $('mk').disabled=false;
};
$('rs').onclick=async function(){
  var p=picked();if(!p.length)return;$('rs').disabled=true;
  for(var i=0;i<p.length;i++){
    var r=await call({op:'reset',id:p[i].id});
    RES[p[i].id]=r.ok?'비밀번호 0000':'실패: '+r.e;draw();
  }
  $('rs').disabled=false;
};
$('sd').onclick=async function(){
  var p=picked();if(!p.length)return;$('sd').disabled=true;
  for(var i=0;i<p.length;i++){
    try{
      for(var k in SAMPLE){await setDoc(doc(db,'vday',p[i].id,'days',k),{items:SAMPLE[k],done:{},start:0,t:Date.now()})}
      RES[p[i].id]='샘플 지정 넣음';
    }catch(e){RES[p[i].id]='실패: 지정 저장'}
    draw();
  }
  $('sd').disabled=false;
};
getRedirectResult(auth).catch(function(){});
onAuthStateChanged(auth,async function(u){
  if(!u)return;
  $('who').textContent=u.email;
  try{await boot()}catch(e){$('le').textContent='선생님 계정이 아니거나 명부를 읽지 못했습니다'}
});
</script>
</body>
</html>
