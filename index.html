<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#1a2233;--sub:#6b7480;--line:#e1e5ec;--main:#1e3a6e;--soft:#e6ecf7;--warn:#c2562f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 48px}
.hide{display:none!important}
.brand{font-size:15px;font-weight:700;color:var(--main);letter-spacing:.02em;margin-bottom:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
h1{font-size:22px;line-height:1.35;margin-bottom:6px}
.sub{color:var(--sub);font-size:14px}
label{display:block;font-size:13px;color:var(--sub);margin:16px 0 6px}
input{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--main);border-color:transparent}
.btn{display:block;width:100%;margin-top:22px;padding:15px;border:0;border-radius:12px;background:var(--main);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:10px}
.err{color:var(--warn);font-size:14px;margin-top:12px;min-height:20px}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.date{font-size:14px;color:var(--sub)}
.prog{margin:14px 0 4px;height:8px;border-radius:8px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--main);border-radius:8px;transition:width .3s}
.cnt{font-size:13px;color:var(--sub)}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1;height:44px;border:0;border-radius:12px;background:#e8ebf1;color:#5d6572;font:inherit;font-size:15px;font-weight:700;cursor:pointer}.tabs button small{display:block;font-size:11px;font-weight:500;opacity:.8}.tabs button.on{background:var(--ink);color:#fff}
.stp{display:flex;gap:10px;margin:6px 0 18px}.stp button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px 6px 12px;font:inherit;color:var(--ink);cursor:pointer;text-align:center}.stp button.cur{border-color:var(--main);box-shadow:0 0 0 1px var(--main) inset}.stp .c{width:52px;height:52px;border-radius:50%;margin:0 auto 8px;border:2px solid var(--main);background:conic-gradient(var(--main) calc(var(--p)*1%),var(--soft) 0);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;transition:background .3s}.stp .full .c{background:var(--main)}.stp b{display:block;font-size:14px}.stp small{display:block;font-size:12px;color:var(--sub);margin-top:2px}.sh{font-size:15px;font-weight:700;margin:4px 4px 8px}
.dcard{margin-bottom:22px}.dh{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px}.dh b{font-size:17px}.dcard .prog{margin:0 0 12px}
.sec{font-size:13px;font-weight:700;color:var(--sub);margin:22px 4px 10px}
.task{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer}
.task .no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--main);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.task .tx{flex:1;min-width:0}
.task .nm{font-size:16px;font-weight:600}
.task .tg{font-size:12px;color:var(--sub);margin-top:3px}
.task .go{flex:none;color:var(--main);font-size:20px}
.task.now{border-color:var(--main);box-shadow:0 0 0 2px var(--soft)}
.task.done{background:transparent}
.ck{flex:none;font:inherit;font-size:13px;font-weight:700;padding:9px 12px;border-radius:10px;border:1px solid var(--main);background:#fff;color:var(--main);cursor:pointer}
.task.done .ck{border-color:var(--line);color:var(--sub)}
.task.done .nm{text-decoration:line-through;color:#a4aea8;font-weight:500}
.task.done .no{background:#eceeed;color:#a4aea8}
.week{display:flex;justify-content:space-between}
.week div{flex:1;text-align:center;font-size:13px;color:var(--sub)}
.week b{display:block;width:30px;height:30px;margin:6px auto 0;border-radius:50%;border:1.5px solid var(--line)}
.week .ok b{background:var(--main);border-color:var(--main)}
.week .today b{border-color:var(--main)}
.foot{margin-top:28px}
.rf{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px;color:var(--ink);text-decoration:none}.rf b{display:block;font-size:15px}.rf small{display:block;font-size:13px;color:var(--sub);margin-top:2px}.rf i{margin-left:auto;font-style:normal;color:var(--sub);font-size:22px}
.task.lk .no{background:var(--main);color:#fff}.task.opt{background:#fff8d6;border-color:#efe2a3}.task.done.lk .no{background:#eceeed;color:#a4aea8}.task.opt.done{background:transparent;border-color:var(--line)}.rf{background:#e6f6ea;border-color:#b7e0c1}.rf i{color:#2f8a4d}
.hwb{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.hwh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;font-size:15px;font-weight:700}
.hwh small{font-size:13px;font-weight:500;color:var(--sub)}
.hwr{padding:2px 16px 14px;border-top:1px solid var(--line)}
.hwi{padding:12px 0 0}.hwi b{font-size:14px}.hwi small{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.hws{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.hws div{min-width:38px;height:34px;padding:0 6px;border-radius:9px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#c3cad6;cursor:pointer}
.hws .O{background:#1e3a6e;border-color:#1e3a6e;color:#fff;cursor:default}
.hws .T{background:#d99a1f;border-color:#d99a1f;color:#fff;cursor:default}
.hws .X{background:#c2562f;border-color:#c2562f;color:#fff;cursor:default}
.hws .N,.hws .A,.hws .R{background:#9aa3b0;border-color:#9aa3b0;color:#fff;font-size:12px;cursor:default}
.hws .S{background:#e3eaf6;border-color:#e3eaf6;color:#9fb0cf}
.hwm{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.hwm div{cursor:pointer;width:30px;height:30px;box-sizing:border-box;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#fff;border:1.5px solid #1e3a6e;color:#1e3a6e}.hwm .d{background:#e4e9f2;border-color:#e4e9f2;color:#a9b4c6;font-weight:400}
.hwk .hws div{cursor:default;border-style:dashed}.hwk .hws .O,.hwk .hws .T,.hwk .hws .X,.hwk .hws .N,.hwk .hws .A,.hwk .hws .R{border-style:solid}

<body>
<div class="wrap">

<section id="login">
  <div class="brand">비타민영어클리닉</div>
  <div class="card">
    <h1>이름과 비밀번호를 입력하세요</h1>
    <label for="nm">이름</label>
    <input id="nm" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="off" spellcheck="false">
    <div class="err" id="e1"></div>
    <button class="btn" id="go1">들어가기</button>
  </div>
</section>

<section id="chg" class="hide">
  <div class="brand">비타민영어클리닉</div>
  <div class="card">
    <h1>새 비밀번호를 정하세요</h1>
    <label for="p1">새 비밀번호</label>
    <input id="p1" type="password" autocomplete="off">
    <label for="p2">한 번 더</label>
    <input id="p2" type="password" autocomplete="off">
    <div class="err" id="e2"></div>
    <button class="btn" id="go2">저장</button>
  </div>
</section>

<section id="home" class="hide">
  <div class="top">
    <div><div class="date" id="dt"></div><h1 id="hi"></h1></div>
    <button class="btn" id="out2" style="width:auto;margin:0;padding:12px 18px;white-space:nowrap">저장하고 나가기</button>
  </div>
  <div id="hwbox"></div>
  <div class="tabs" id="tabs"></div>
  <div id="cards"></div>
  <div class="sh">이번 주 스탬프</div>
  <div class="stp" id="stamps"></div>
  <div id="hwchk"></div>
  <div class="foot" style="display:none">
    <button class="btn" id="out">저장하고 나가기</button>
  </div>
</section>

</div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,setPersistence,browserLocalPersistence,inMemoryPersistence,signInWithEmailAndPassword,updatePassword,signOut,onAuthStateChanged,initializeAuth,browserSessionPersistence} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,collection,getDocs,getDoc,doc,updateDoc,deleteField} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
var app=initializeApp({apiKey:"AIzaSyC88G-OjMJOqVqnIVqunzh7fvk91wtKKnA",authDomain:"h-roadmap.firebaseapp.com",projectId:"h-roadmap",appId:"1:575520405083:web:b9f40b64cb0ae3d1a9317e"},'vita');
var TAB=false;try{if(/[?&]tablet=1/.test(location.search))localStorage.setItem('vita-tablet','1');TAB=localStorage.getItem('vita-tablet')==='1'}catch(e){}
var auth=TAB?initializeAuth(app,{persistence:browserSessionPersistence}):getAuth(app),db=getFirestore(app);
var $=function(i){return document.getElementById(i)};
var DAY=['일','월','화','수','목','금','토'];
var PAD='#vt',KEYS=['reg','fri','mkp'],TN={reg:'Day 1',reg2:'Day 2',fri:'Friday',mkp:'Saturday'},TABS=['reg','reg2','fri','mkp'];
var BAD=['1234','0000','1111','2222','3333','4444','5555','6666','7777','8888','9999','12345','123456'];
var CUR='',TS={reg:'Day 1',reg2:'Day 2',fri:'Friday',mkp:'Saturday'};
var D={},me='',uid='',nameNow='',initial=false,busy=false;
function em(n){return 'n'+Array.from(new TextEncoder().encode(n)).map(function(b){return b.toString(16).padStart(2,'0')}).join('')+'@vita.local'}
function show(id){['login','chg','home'].forEach(function(s){$(s).classList.toggle('hide',s!==id)});window.scrollTo(0,0)}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

async function load(){
  D={};
  var snap=await getDocs(collection(db,'vday',uid,'days'));
  snap.forEach(function(d){if(KEYS.indexOf(d.id)>-1||d.id==='ref')D[d.id]=d.data()});
  await loadHw();render();show('home');
}
function dk(k){return k==='reg2'?'reg':k}
function off(k){return k==='reg2'?100:0}
function wkStart(){var n=new Date(),d=new Date(n);d.setHours(18,0,0,0);d.setDate(d.getDate()-((d.getDay()+1)%7));if(d.getTime()>n.getTime())d.setDate(d.getDate()-7);return d.getTime()}
function isD(k,i){var x=D[dk(k)]||{},t=x.done&&x.done[i+off(k)];return !!t&&t>=wkStart()}
function isOpt(it){return /^dl-/.test(it.c||'')||/대화문/.test(it.n||'')||/^비단챌 문장성분/.test(it.n||'')}
function info(k){var x=D[dk(k)]||{};var m=x.items||[];var rq=0,dn=0;m.forEach(function(it,i){if(isOpt(it))return;rq++;if(isD(k,i))dn++});return {m:m,dn:dn,rq:rq,full:rq>0&&dn===rq}}
function refBox(){var r=(D.ref&&D.ref.items)||[];if(!r.length)return '';return '<div class="dcard"><div class="dh"><b>참고자료</b></div>'+r.map(function(it){var h=it.u?' href="'+esc(it.u)+'" target="_blank" rel="noopener"':'';return '<a class="rf"'+h+'><div><b>'+esc(it.n)+'</b><small>'+esc(it.t||'')+'</small></div><i>&rsaquo;</i></a>'}).join('')+'</div>'}
function render(){
  var d=new Date();
  $('hwbox').innerHTML=isT()?hwMemoBox():hwBox();$('hwchk').innerHTML=isT()?hwChkBox():'';$('dt').textContent=(d.getMonth()+1)+'/'+d.getDate()+'('+DAY[d.getDay()]+')';
  $('hi').textContent=me+'님';
  var have=TABS.filter(function(k){return info(k).m.length>0&&(k!=='mkp'||(D.mkp&&D.mkp.on===true))});
  if(!have.length){$('tabs').innerHTML='';$('cards').innerHTML='<div class="card"><div class="sub">지정된 학습이 없습니다</div></div>'+refBox();return}
  if(!CUR||have.indexOf(CUR)<0){CUR=savedTab(have);if(!CUR){var w=new Date().getDay(),dd=w===5?'fri':(w===6?'mkp':(info('reg').full&&have.indexOf('reg2')>-1?'reg2':'reg'));CUR=have.indexOf(dd)>-1?dd:have[0]}}
  $('tabs').innerHTML=have.map(function(k){return '<button data-t="'+k+'"'+(k===CUR?' class="on"':'')+'>'+TS[k]+'</button>'}).join('');
  $('stamps').innerHTML=have.map(function(k){var f=info(k),left=f.rq-f.dn;return '<button data-s="'+k+'" class="'+(f.full?'full ':'')+(k===CUR?'cur':'')+'"><div class="c" style="--p:'+(f.rq?Math.round(f.dn/f.rq*100):0)+'">'+(f.full?'&#10003;':'')+'</div><b>'+TS[k]+'</b><small>'+(f.full?'모두 완료':f.dn+'/'+f.rq+' · 남은 '+left+'개')+'</small></button>'}).join('');
  $('cards').innerHTML=[CUR].map(function(k){
    var f=info(k),first=-1;
    f.m.forEach(function(it,i){if(first<0&&!isD(k,i)&&!isOpt(it))first=i});
    var items=f.m.map(function(it,i){
      var dn=isD(k,i);
      return '<div class="task'+(dn?' done':'')+(i===first?' now':'')+(it.u?' lk':'')+(isOpt(it)?' opt':'')+'" data-k="'+k+'" data-i="'+i+'"><div class="no">'+(i+1)+'</div><div class="tx"><div class="nm">'+esc(it.n)+'</div><div class="tg">'+esc(it.t||'')+'</div></div>'+(it.u?'<button class="ck" data-lk="1">학습링크</button>':'')+'</div>';
    }).join('');
    return '<div class="dcard" id="dc'+k+'"><div class="dh"><b>'+TN[k]+'</b><span class="cnt">'+f.rq+'개 중 '+f.dn+'개 완료</span></div><div class="prog"><i style="width:'+(f.rq?f.dn/f.rq*100:0)+'%"></i></div>'+items+'</div>';
  }).join('')+refBox();
}


var HW=null,HWC={},WK='',HWOPEN=false;
var HWMO=true;function isT(){return /^tch/.test(uid||'')}
function wkKey(){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+1)%7));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
async function loadHw(){
  HW=null;var tk=D.reg&&D.reg.tk;if(!tk)return;
  try{
    var s=await getDoc(doc(db,'hw_p',tk));if(!s.exists())return;
    var x=s.data(),meta=x.meta;if(typeof meta==='string')meta=JSON.parse(meta);
    if(!meta||!meta.items||!meta.items.length)return;
    WK=wkKey();var w={};try{var j=(x.w||{})[WK];w=typeof j==='string'?JSON.parse(j):(j||{})}catch(e){}
    HW={items:meta.items,w:w};HWC=((D.reg.hc||{})[WK])||{};
  }catch(e){HW=null}
}
var HSY={O:'O',T:'△',X:'X',N:'미',A:'결',R:'쉼'};
function hwBox(){
  if(!HW)return '';
  var tot=0,dn=0;
  var rows=HW.items.map(function(it){
    var n=it.n||0,ms=HW.w[it.k]||[],cl=HWC[it.k]||[],cells='';
    for(var s=0;s<n;s++){
      var m=ms[s]||'',c=!m&&cl[s]===true,cls='',tx='';
      if(m){cls=m;tx=HSY[m]||''}else if(c){cls='S';tx='✓'}else{tx=(it.labels&&it.labels[s])||''}
      if(m!=='R'&&m!=='A')tot++;
      if(m==='O'||c)dn++;
      cells+='<div class="'+cls+'" data-hk="'+esc(it.k)+'" data-hs="'+s+'" data-hm="'+(m?1:0)+'">'+esc(tx)+'</div>';
    }
    return '<div class="hwi"><b>'+esc(it.label)+'</b><small>'+esc(it.sub||'')+'</small><div class="hws">'+cells+'</div></div>';
  }).join('');
  return '<div class="hwb"><div class="hwh" data-hh="1"><span>숙제</span><small>'+dn+' / '+tot+' · '+(HWOPEN?'접기':'펼치기')+'</small></div>'+(HWOPEN?'<div class="hwr">'+rows+'</div>':'')+'</div>';
}
function hwMemoBox(){
  if(!HW)return '';
  var rows=HW.items.map(function(it){
    var n=it.n||0,cl=HWC[it.k]||[],cells='';
    for(var s=0;s<n;s++){
      var dn=(cl[s]===true);
      cells+='<div'+(dn?' class="d"':'')+' data-hk="'+esc(it.k)+'" data-hs="'+s+'" data-hm="0">'+esc((it.labels&&it.labels[s])||'')+'</div>';
    }
    return '<div class="hwi"><b>'+esc(it.label)+'</b><small>'+esc(it.sub||'')+'</small><div class="hwm">'+cells+'</div></div>';
  }).join('');
  return '<div class="hwb"><div class="hwh" data-hh="1"><span>주간 숙제</span><small>'+(HWMO?'접기':'펼치기')+'</small></div>'+(HWMO?'<div class="hwr">'+rows+'</div>':'')+'</div>';
}
function hwChkBox(){
  if(!HW)return '';
  var tot=0,dn=0;
  var rows=HW.items.map(function(it){
    var n=it.n||0,ms=HW.w[it.k]||[],cells='';
    for(var s=0;s<n;s++){var m=ms[s]||'';if(m!=='R'&&m!=='A')tot++;if(m==='O')dn++;cells+='<div class="'+m+'">'+esc(HSY[m]||'')+'</div>'}
    return '<div class="hwi"><b>'+esc(it.label)+'</b><small>'+esc(it.sub||'')+'</small><div class="hws">'+cells+'</div></div>';
  }).join('');
  return '<div class="hwb hwk" style="margin-top:14px"><div class="hwh" style="cursor:default"><span>선생님 숙제 확인</span><small>'+dn+' / '+tot+'</small></div><div class="hwr">'+rows+'</div></div>';
}
$('hwbox').onclick=async function(e){
  if(e.target.closest('[data-hh]')){if(isT()){HWMO=!HWMO;$('hwbox').innerHTML=hwMemoBox()}else{HWOPEN=!HWOPEN;$('hwbox').innerHTML=hwBox()}return}
  var c=e.target.closest('[data-hk]');if(!c||c.getAttribute('data-hm')==='1'||!HW||!uid)return;
  var k=c.getAttribute('data-hk'),s=+c.getAttribute('data-hs');
  var prev=(HWC[k]||[]).slice(),arr=prev.slice();
  while(arr.length<=s)arr.push(false);
  arr[s]=!arr[s];HWC[k]=arr;$('hwbox').innerHTML=isT()?hwMemoBox():hwBox();
  try{
    var u={};u['hc.'+WK+'.'+k]=arr;
    await updateDoc(doc(db,'vday',uid,'days','reg'),u);
    var r=D.reg=D.reg||{};r.hc=r.hc||{};r.hc[WK]=r.hc[WK]||{};r.hc[WK][k]=arr;
  }catch(er){HWC[k]=prev;$('hwbox').innerHTML=isT()?hwMemoBox():hwBox()}
};
$('go1').onclick=async function(){
  var n=$('nm').value.replace(/\s/g,''),p=$('pw').value;
  if(!n||!p){$('e1').textContent='이름과 비밀번호를 모두 입력하세요';return}
  $('e1').textContent='';$('go1').disabled=true;busy=true;
  try{
    initial=(p==='1234'||p==='0000');
    await setPersistence(auth,initial?inMemoryPersistence:(TAB?browserSessionPersistence:browserLocalPersistence));
    var c=await signInWithEmailAndPassword(auth,em(n),p+PAD);
    uid=c.user.uid;me=c.user.displayName||n;nameNow=n;
    if(initial){show('chg')}else{await load()}
  }catch(e){$('e1').textContent='이름 또는 비밀번호가 맞지 않습니다'}
  busy=false;$('go1').disabled=false;
};
$('go2').onclick=async function(){
  var a=$('p1').value,b=$('p2').value;
  if(a.length<4){$('e2').textContent='4자 이상 입력하세요';return}
  if(BAD.indexOf(a)>-1){$('e2').textContent='너무 쉬운 비밀번호입니다';return}
  if(a!==b){$('e2').textContent='두 칸이 다릅니다';return}
  $('e2').textContent='';$('go2').disabled=true;busy=true;
  try{
    await updatePassword(auth.currentUser,a+PAD);
    await signOut(auth);
    await setPersistence(auth,TAB?browserSessionPersistence:browserLocalPersistence);
    await signInWithEmailAndPassword(auth,em(nameNow),a+PAD);
    await load();
  }catch(e){$('e2').textContent='저장하지 못했습니다. 처음부터 다시 들어와 주세요'}
  busy=false;$('go2').disabled=false;
};
$('cards').onclick=async function(e){
  var t=e.target.closest('.task');if(!t)return;
  var k=t.getAttribute('data-k'),i=+t.getAttribute('data-i'),d0=dk(k),ix=i+off(k),x=D[d0],now=Date.now(),it=x.items[i];
  var isDone=isD(k,i);
  var u={};
  if(e.target.closest('[data-lk]')){
    if(!it.u)return;
    if(!x.start){
      u.start=now;u.t=now;
      try{await updateDoc(doc(db,'vday',uid,'days',d0),u);x.start=now;x.t=now}catch(er){}
    }
    try{sessionStorage.setItem('vita-in','1');sessionStorage.setItem('vita-at',JSON.stringify({k:k,i:i,r:/^rd-/.test(it.c||'')?1:0}));sessionStorage.removeItem('vita-mk')}catch(e){}wnSet();location.href=lk(it.u,k,i);return;
  }
  if(isDone){u['done.'+ix]=deleteField();u.t=now}
  else{u['done.'+ix]=now;u.t=now;if(!x.start)u.start=now}
  try{
    await updateDoc(doc(db,'vday',uid,'days',d0),u);
    x.done=x.done||{};
    if(isDone)delete x.done[ix];else{x.done[ix]=now;if(!x.start)x.start=now}
    x.t=now;render();
  }catch(er){}
};
