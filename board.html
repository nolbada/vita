<style>
:root{--ink:#1a2233;--sub:#6b7480;--line:#dde3ee;--bg:#f4f6fa}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{height:100vh;display:flex;flex-direction:column;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink)}
body[data-m=mon]{--a:#1E3A6E;--soft:#E6ECF7}
body[data-m=info]{--a:#5B3E96;--soft:#EDE7F7}
.hide{display:none!important}
header{display:flex;align-items:center;gap:18px;padding:12px 22px;background:#fff;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:20px;letter-spacing:.08em;color:var(--a)}
nav{display:flex;gap:8px;flex:1}
nav a,nav button{font:inherit;font-size:15px;font-weight:700;width:112px;padding:9px 0;text-align:center;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--sub);text-decoration:none;cursor:pointer}
nav .mon.on{background:#1E3A6E;color:#fff;border-color:#1E3A6E}
nav .info.on{background:#5B3E96;color:#fff;border-color:#5B3E96}
nav .mon.on{background:#1E3A6E;color:#fff;border-color:#1E3A6E}
nav .room.on{background:#B4532A;color:#fff;border-color:#B4532A}
nav .rec.on{background:#9B2D5A;color:#fff;border-color:#9B2D5A}
nav .cls.on{background:#1F6F8B;color:#fff;border-color:#1F6F8B}
#clist{flex:1;overflow:auto;padding:14px 22px 22px}.cg{margin:0 0 18px}.cg h3{margin:0 0 8px;font-size:15px;color:#1F6F8B}.cr{display:flex;flex-wrap:wrap;gap:10px}.cl{display:flex;align-items:center;justify-content:center;min-width:150px;height:52px;padding:0 20px;border-radius:12px;background:#E3EFF4;color:#14495c;font-weight:700;font-size:16px;text-decoration:none;border:1px solid #bcd7e1}.cl:active{background:#1F6F8B;color:#fff}
body[data-m=cls]{--a:#1F6F8B;--soft:#E3EFF4}

  attList().forEach(function(a){var s=byN[nm(a.name)];if(s)want[s.id]=1});
  Object.keys(FS).forEach(function(id){if(!want[id]){try{FS[id]()}catch(e){}delete FS[id];delete DATA[id]}});
  Object.keys(want).forEach(function(id){
    if(FS[id])return;
    FS[id]=onSnapshot(doc(db,'vday',id,'days','fri'),function(sn){DATA[id]=sn.exists()?sn.data():null;render()},function(){DATA[id]=null;render()});
  });
}
function watchAtt(){
  if(UA)return;
  UA=onSnapshot(doc(db,'att','d_'+isoToday()),function(sn){
    var o={};if(sn.exists()){try{o=JSON.parse(sn.data().j)||{}}catch(e){o={}}}
    ATT=o;ATTERR='';syncFri();render();
  },function(){ATT=null;ATTERR='출석부를 읽지 못했습니다';render()});
}
function renderFri(){
  var g=$('grid'),L=attList(),byN={};

  L.sort(function(a,b){return a.name.localeCompare(b.name,'ko')});
  if(!L.length){g.style.display='flex';g.innerHTML='<div class="empty">아직 도착한 학생이 없습니다</div>';return}
  g.style.display='grid';

  g.style.gridTemplateColumns='repeat('+c+',1fr)';g.style.gridTemplateRows='repeat('+r+',1fr)';

    var sub=[a.s?a.s.cls.replace(/^[MT]/,''):'',at,rm].filter(Boolean).join(' \u00B7 ');
    var f=a.s&&DATA[a.s.id]?info(a.s.id):null;
    if(!f){return '<div class="st em"><div><div class="n">'+esc(a.name)+'</div><div class="tg">'+esc(sub)+'</div><div class="hw">'+(a.s&&DATA[a.s.id]===undefined?'기록 불러오는 중':'EM 기록')+'</div></div></div>'}
    var segs='',h=hwOf(a.s.id),ht='주간 숙제 기록 없음',hx=false;
    if(h&&h.all){var p=[];if(h.O)p.push('O '+h.O);if(h.T)p.push('\u25B3 '+h.T);if(h.X){p.push('X '+h.X);hx=true}ht='주간 숙제 '+p.join(' \u00B7 ')}
    f.rows.forEach(function(x){if(x.o)return;segs+='<i class="'+(x.d?'d':'')+'"></i>'});
    return '<button class="st'+(f.rq&&f.dn===f.rq?' full':'')+(hx?' hx':'')+'" data-id="'+a.s.id+'"><div><div class="n">'+esc(a.name)+'</div><div class="tg">'+esc(sub)+'</div><div class="hw'+(hx?' x':'')+'">'+ht+'</div></div><div><div class="seg">'+segs+'</div><div class="ft"><b>'+f.dn+' / '+f.rq+'</b><span>'+(f.last?hm(f.last):'')+'</span></div></div></button>';
  }).join('');
}
function bar(){
  var sl=slots();
  var md=[['reg','Day 1'],['reg2','Day 2'],['fri','Friday'],['mkp','Saturday']];
  $('bar').innerHTML=md.map(function(a){return '<button class="pill'+(a[0]===M?' on':'')+'" data-md="'+a[0]+'">'+a[1]+'</button>'}).join('')+'<div class="sep"></div>'+(M==='fri'?[['','\uC804\uCCB4'],['\uB0A8','\uB0A8쌤'],['\uC5EC','\uC5EC쌤']].map(function(a){return '<button class="pill'+(a[0]===RM?' on':'')+'" data-rm="'+a[0]+'">'+a[1]+'</button>'}).join(''):sl.map(function(x,i){return '<button class="pill'+(i===SL?' on':'')+'" data-sl="'+i+'">'+x.t.join(' / ')+'</button>'}).join(''));
}
function render(){
  bar();
  if(M==='fri'){renderFri();return}
  var sl=slots();
  var cls=sl.length?(sl[SL]||sl[0]).c:[];
  var list=ST.filter(function(s){return cls.indexOf(s.cls)>-1&&DATA[s.id]}).sort(function(a,b){return a.name.localeCompare(b.name,'ko')});
  var g=$('grid');

  g.innerHTML=list.map(function(s){
    var f=info(s.id),segs='',k=0,h=hwOf(s.id),ht='주간 숙제 기록 없음',hx=false;
    if(h&&h.all){var p=[];if(h.O)p.push('O '+h.O);if(h.T)p.push('\u25B3 '+h.T);if(h.X){p.push('X '+h.X);hx=true}ht='주간 숙제 '+p.join(' \u00B7 ')}
    f.rows.forEach(function(x){if(x.o)return;segs+='<i class="'+(x.d?'d':'')+'"></i>'});
    return '<button class="st'+(f.rq&&f.dn===f.rq?' full':'')+(hx?' hx':'')+'" data-id="'+s.id+'"><div><div class="n">'+esc(s.name)+'</div><div class="tg">'+esc(s.cls.replace(/^[MT]/,''))+'</div><div class="hw'+(hx?' x':'')+'">'+ht+'</div></div><div><div class="seg">'+segs+'</div><div class="ft"><b>'+f.dn+' / '+f.rq+'</b><span>'+(f.last?hm(f.last):'')+'</span></div></div></button>';
  }).join('');
}
$('grid').onclick=function(e){
  var b=e.target.closest('.st');if(!b)return;
  var s=ST.filter(function(x){return x.id===b.getAttribute('data-id')})[0];if(!s)return;var f=info(s.id);if(!f)return;
  $('ov').innerHTML='<div class="pop"><h2>'+esc(s.name)+'</h2><div class="tg">'+f.dn+' / '+f.rq+(f.last?' · 마지막 '+hm(f.last):'')+'</div>'+f.rows.map(function(x){return '<div class="it'+(x.d?' d':'')+(x.o?' o':'')+'"><div class="ck">'+(x.d?'&#10003;':'')+'</div><div><div class="nm">'+esc(x.n)+'</div><div class="tg" style="margin:0">'+esc(x.t)+'</div></div><div class="tm">'+(x.at?hm(x.at):'')+'</div></div>'}).join('')+'</div>';
  $('ov').classList.remove('hide');
};
$('ov').onclick=function(e){if(e.target===$('ov'))$('ov').classList.add('hide')};
$('bar').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-md')){M=b.getAttribute('data-md');watch()}
  else if(b.hasAttribute('data-rm')){RM=b.getAttribute('data-rm');render()}
  else if(b.hasAttribute('data-sl')){SL=+b.getAttribute('data-sl');watch()}
};
var FRS={room:'room.html?in=1',hw:'/via/hw/'};
var CLSINIT=0,CLSU={'여':'/via/links/teacher/','남':''};
var CLSL=[["여","FBI","고1 9월 (수업용)","/via/fbi/g1-9-class/"],["여","FBI","고2 6월 (수업용)","/via/fbi/g2-6-class/"],["여","천일문S","문장줄이기 (수업용)","/via/sj/teacher/"],["남","문법","해커스 제대로 어법","/via/eobeop-jedaero/"]];
function setCls(t){
  document.querySelectorAll('#p-cls .pill').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-t')===t)});
  var g={},o=[];CLSL.forEach(function(r){if(r[0]!==t)return;if(!g[r[1]]){g[r[1]]=[];o.push(r[1])}g[r[1]].push(r)});
  var h='';o.forEach(function(k){h+='<div class="cg"><h3>'+k+'</h3><div class="cr">'+g[k].map(function(r){return '<a class="cl" target="_blank" rel="noopener" href="'+r[3]+'">'+r[2]+'</a>'}).join('')+'</div></div>'});
  $('clist').innerHTML=h||'<div class="ph">등록된 수업자료 없음</div>';
}
function openM(m){
  document.body.setAttribute('data-m',m);
  document.querySelectorAll('nav button').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-m')===m)});
  $('p-mon').classList.toggle('hide',m!=='mon'||!BOOT);
  $('p-info').classList.toggle('hide',m!=='info');
  $('p-room').classList.toggle('hide',m!=='room');
  $('p-hw').classList.toggle('hide',m!=='hw');
  $('p-cls').classList.toggle('hide',m!=='cls');
  if(m==='cls'&&!CLSINIT){CLSINIT=1;setCls('여')}
  if(!BOOT){$('lg').classList.toggle('hide',!(m==='mon'||m==='room'||m==='hw'));$('p-room').classList.add('hide');$('p-hw').classList.add('hide')}
  if(FRS[m]&&BOOT){var f=$('f-'+m);if(!f.getAttribute('src'))f.setAttribute('src',FRS[m])}
  try{history.replaceState(null,'',location.pathname+location.search+(m==='mon'?'':'#'+m))}catch(e){}
}
document.querySelector('nav').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;

};
$('p-cls').onclick=function(e){var b=e.target.closest('.pill');if(b)setCls(b.getAttribute('data-t'))};

tick();setInterval(tick,30000);

  var s=await getDoc(doc(db,'hw_c','master'));var d=JSON.parse(s.data().j);
  ST=d.s.filter(function(o){return o.status==='on'}).map(function(o){return {id:o.id,name:o.name,cls:o.cls}});

  try{await signInWithPopup(auth,new GoogleAuthProvider())}
  catch(e){if(e.code==='auth/popup-blocked'){await signInWithRedirect(auth,new GoogleAuthProvider())}else{$('le').textContent='로그인하지 못했습니다'}}
